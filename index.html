<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ahmed Hamdi | Video Editor</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial,Helvetica,sans-serif;
    }

    body{
      background:linear-gradient(-45deg,#050505,#0d1b2a,#0f4c81,#1f6feb);
      background-size:400% 400%;
      animation:bg 10s ease infinite;
      color:white;
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      text-align:center;
    }

    @keyframes bg{
      0%{background-position:0% 50%;}
      50%{background-position:100% 50%;}
      100%{background-position:0% 50%;}
    }

    h1{
      font-size:60px;
      margin-bottom:20px;
    }

    p{
      font-size:22px;
      color:#d7e7ff;
      margin-bottom:35px;
    }

    a{
      background:#1f6feb;
      color:white;
      text-decoration:none;
      padding:15px 35px;
      border-radius:50px;
      font-size:20px;
      transition:.3s;
    }

    a:hover{
      background:#4ea1ff;
      box-shadow:0 0 20px #4ea1ff;
    }
  </style>
</head>

<body>

<div>
<h1>Ahmed Hamdi</h1>
<p>Creative Video Editor & Motion Designer</p>

<a href="#">View My Work</a>

</div>

</body>
</html>
